name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Version in the file name, so downloads of different builds can't be mixed up.
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/PDFWriter-v${{ steps.ver.outputs.name }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/PDFWriter-v${{ steps.ver.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDFWriter-apk
          path: out/*.apk
          retention-days: 30

      # Every push to main publishes/updates the release for the current versionName.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: PDFWriter v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/PDFWriter-v${{ steps.ver.outputs.name }}.apk
          make_latest: true
          body: |
            Download **PDFWriter-v${{ steps.ver.outputs.name }}.apk** below and open it on your phone or tablet to install.
            - Finger scrolls, S Pen writes
            - Hold the S Pen side button to erase
            - Saves automatically; just close the app
