name: Page loading timing test

# Runs the app on an Android emulator, scrolls like a user and records timings + screenshots.
on:
  push:
    branches: [ perf ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Make test PDFs
        run: |
          pip install reportlab pillow
          mkdir -p app/src/androidTest/assets
          python3 tools/perf/make_pdfs.py app/src/androidTest/assets
          ls -la app/src/androidTest/assets

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest -PallAbis

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1200x1920
            adb shell wm density 240
            adb logcat -G 16M || true
            adb logcat -c || true
            ./gradlew connectedDebugAndroidTest -PallAbis -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            adb logcat -d -s PWPERF:I > perf.log || true
            mkdir -p shots && adb pull /sdcard/Android/data/com.titipong.pdfwriter/files/perf shots || true

      - name: Show timings
        run: |
          wc -l perf.log || true
          cat perf.log || true
          find shots -type f | sort || true
          (cd shots && zip -qr ../perf-shots.zip .) || true
          cp perf.log perf-log.txt || true

      - name: Publish results
        uses: softprops/action-gh-release@v2
        with:
          tag_name: perf-results
          name: Page loading timing results
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            perf-log.txt
            perf-shots.zip
