name: Windows build

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Handwriting helper (Windows Ink)
        shell: pwsh
        run: dotnet build hwr/hwr.csproj -c Release -o appResources/windows/hwr

      - name: OCR data (Thai + English, tessdata_best)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force appResources/common/tessdata | Out-Null
          foreach ($l in @("tha", "eng")) {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata" -OutFile "appResources/common/tessdata/$l.traineddata"
          }
          Get-ChildItem appResources -Recurse | Select-Object FullName, Length

      - name: Build app
        shell: pwsh
        run: ./gradlew.bat createDistributable --no-daemon --stacktrace

      - name: Make zip
        shell: pwsh
        run: |
          $app = "build/compose/binaries/main/app/PDFWriter"
          foreach ($d in @("vcomp140.dll", "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $src = "C:\Windows\System32\$d"
            if (Test-Path $src) { Copy-Item $src $app -Force }
          }
          Compress-Archive -Path $app -DestinationPath PDFWriter-Windows.zip -CompressionLevel Optimal
          Get-Item PDFWriter-Windows.zip | Select-Object Name, Length

      - name: Self test on Windows
        shell: pwsh
        run: |
          $exe = "build/compose/binaries/main/app/PDFWriter/PDFWriter.exe"
          $rep = "$PWD/selftest.txt"
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$rep`"" -PassThru
          $p.WaitForExit(180000) | Out-Null
          if (Test-Path $rep) { Get-Content $rep -Encoding UTF8 } else { "no report" }
          # Open, add text, quit; then start again and check.
          $doc = "$env:USERPROFILE\Documents\flow-test.pdf"
          Copy-Item "$env:APPDATA\PDFWriter\cache\selftest\new.pdf" $doc
          $flow = "$PWD/flow.txt"
          Start-Process $exe -ArgumentList "--flowtest", "A", "`"$doc`"", "`"$flow`"" -Wait
          Start-Process $exe -ArgumentList "--flowtest", "B", "`"$doc`"", "`"$flow`"" -Wait
          if (Test-Path $flow) { Get-Content $flow -Encoding UTF8 } else { "no flow report" }
          # The app with a file open, for a screenshot.
          $p2 = Start-Process $exe -ArgumentList "`"$env:APPDATA\PDFWriter\cache\selftest\annotated.pdf`"" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $gr = [System.Drawing.Graphics]::FromImage($bmp)
          $gr.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          # Draw a zigzag with the pen (mouse), then look again.
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class M {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          }
          "@
          [M]::SetCursorPos(400, 450); Start-Sleep -Milliseconds 300
          [M]::mouse_event(2, 0, 0, 0, 0)
          for ($i = 0; $i -le 40; $i++) { [M]::SetCursorPos(400 + $i * 6, 450 + (($i % 8) - 4) * 8); Start-Sleep -Milliseconds 15 }
          [M]::mouse_event(4, 0, 0, 0, 0)
          Start-Sleep -Seconds 2
          # Middle button drag up: the pages should scroll down.
          [M]::SetCursorPos(500, 600); Start-Sleep -Milliseconds 200
          [M]::mouse_event(0x20, 0, 0, 0, 0)
          for ($i = 0; $i -le 30; $i++) { [M]::SetCursorPos(500, 600 - $i * 15); Start-Sleep -Milliseconds 15 }
          [M]::mouse_event(0x40, 0, 0, 0, 0)
          Start-Sleep -Seconds 3
          $gr.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width / 2)), ([int]($b.Height / 2))
          $small.Save("$PWD/shot-small.png")
          "SHOT-BEGIN"
          [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD/shot-small.png"))
          "SHOT-END"
          "app running: $(-not $p2.HasExited)"
          if (-not $p2.HasExited) { Stop-Process $p2 -Force }
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest.txt
            screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: PDFWriter-Windows
          path: PDFWriter-Windows.zip

      - name: Publish (pre-release, separate from the Android releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete windows-latest -y --cleanup-tag 2>$null
          gh release create windows-latest PDFWriter-Windows.zip --target ${{ github.sha }} --prerelease --title "PDFWriter for Windows" --notes "Unzip, then run PDFWriter.exe (in the PDFWriter folder)."
